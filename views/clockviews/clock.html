<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Nightscout</title>

  <link href="/images/round1.png" rel="icon" id="favicon" type="image/png" />
  <link rel="apple-touch-icon" sizes="57x57" href="/images/apple-touch-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/images/apple-touch-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/images/apple-touch-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/images/apple-touch-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/images/apple-touch-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/images/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/images/apple-touch-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon-180x180.png">

  <style type="text/css">
    @import url("//fonts.googleapis.com/css?family=Open+Sans:700|Noto+Color+Emoji");
    <%- include('clock-shared.css', {}); %>
    <%if (face === 'config') { %>
    <%- include('clock-config.css', {}); %>
    <% } %>
  </style>
</head>

<body>
  <main>
    <a href="/" id="closeButton" class="close"></a>
    <div id="inner" data-face="<%= face %>"<%-(face === 'config') ? 'data-face-config="cy10"' : '' %>>
    </div>
  </main>
  <script type="text/javascript">
    // TEMPORARY diagnostics for old devices: open the clock with ?diag to see
    // load steps, request statuses and script errors on the page itself.
    (function () {
      if ((location.search || '').indexOf('diag') === -1) { return; }
      var box = document.createElement('div');
      box.id = 'diag';
      box.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow:auto;' +
        'z-index:99999;background:rgba(0,0,0,0.85);color:#fff;font:11px/1.3 monospace;' +
        'white-space:pre-wrap;word-wrap:break-word;padding:4px;text-shadow:none;text-align:left');
      document.body.appendChild(box);
      var lines = 0;
      function log (msg) {
        if (lines > 60) { box.removeChild(box.firstChild); }
        var t = new Date();
        box.appendChild(document.createTextNode(t.getHours() + ':' + t.getMinutes() + ':' + t.getSeconds() + ' ' + msg + '\n'));
        lines++;
      }
      window.__diag = log;
      window.onerror = function (msg, src, line, col, err) {
        log('ERROR ' + msg + ' @ ' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
      };
      log('UA ' + navigator.userAgent);
      log('URL ' + location.pathname + location.search);
    })();
  </script>
  <script src="<%= locals.bundle %>/js/bundle.clock.js"></script>

  <script type="text/javascript">
    var clockFace = "<%= face  %>"; // can now be used in scripts
    if (window.__diag) {
      window.__diag('clock bundle executed: ' + (window.Nightscout && window.Nightscout.client ? 'yes' : 'NO') +
        ', jQuery: ' + (window.$ ? 'yes' : 'NO'));
    }

    var parts = (location.search || '?').substring(1).split('&');
    var token = '';
    parts.forEach(function(val) {
      if (val.startsWith('token=')) {
        token = val.substring('token='.length);
      }
    });

    var secret = typeof localStorage !== 'undefined' ? localStorage.getItem('apisecrethash') : '';
    var src = '/api/v1/status.js?t=' + Date.now();

    if (secret) {
      src += '&secret=' + secret;
    } else if (token) {
      src += '&token=' + token;
    }

    var script = document.createElement('script');
    script.onload = function() {
      if (window.__diag) {
        window.__diag('status.js loaded, serverSettings: ' + (window.serverSettings ? 'yes' : 'NO'));
        if (window.$) {
          $(document).ajaxComplete(function (event, xhr, opts) {
            window.__diag('AJAX ' + xhr.status + ' ' + String(opts.url).split('?')[0]);
          });
        }
        var diagClient = window.Nightscout && window.Nightscout.client;
        if (diagClient && diagClient.render) {
          var diagRender = diagClient.render;
          var diagRenders = 0;
          diagClient.render = function () {
            try {
              diagRender.apply(this, arguments);
              diagRenders++;
              if (diagRenders <= 2) {
                window.__diag('render ok #' + diagRenders + ', body bg=' + document.body.style.backgroundColor +
                  ', sg=' + $('.sg').text());
              }
            } catch (e) {
              window.__diag('RENDER EXCEPTION ' + e.message + (e.stack ? '\n' + e.stack : ''));
              throw e;
            }
          };
        } else {
          window.__diag('Nightscout.client NOT available');
        }
      }
      window.Nightscout.client.init();
      if (window.__diag) { window.__diag('init done'); }
    };
    // A refused script fires error, not load, and does not expose the status.
    // Ask once more to read it, and say so on a 401 instead of drawing nothing.
    script.onerror = function() {
      if (window.__diag) { window.__diag('status.js FAILED to load'); }
      $.ajax(src, { dataType: 'text', error: function (xhr) {
        if (xhr && xhr.status === 401) {
          window.Nightscout.client.showNotAuthorized();
        }
      } });
    };
    script.src = src;

    document.head.appendChild(script); //or something of the likes
    <%if (face !== 'config') { %>
    var buttonVisible = true;

    function hideClose () {
      document.getElementById('closeButton').classList.add('hidden');
      buttonVisible = false;
    }

    // Show on start so user knows it's there
    setTimeout(function() {
      hideClose();
    }, 2000);

    function showClose () {
      if (buttonVisible) return;

      buttonVisible = true;
      document.getElementById('closeButton').classList.remove('hidden');
      setTimeout(function() {
        hideClose();
      }, 2000);
    }

    window.addEventListener('touchstart', function() {
      showClose();
    });

    window.addEventListener('click', function() {
      showClose();
    });

    // This fixes the issue of a "stale" CGM value displaying indefinately.
    // It displays "Internet offline." until internet is restored.
    function uOffline() { 
      document.body.innerHTML =
        'Internet offline.'
    }
    // Return to normal as soon as internet connectivity is restored.              
    function uOnline() { 
    	location.reload()
    }
    if(window.addEventListener) { 
      window.addEventListener('offline', uOffline);
      window.addEventListener('online', uOnline);
    } else {
      document.body.attachEvent('onoffline', uOffline);
      document.body.attachEvent('ononline', uOnline);
    }

    <% } %>
  </script>
  <%if (face == 'config') { %>
  <%- include('clock-config.html', {}); %>
  <% } %>
</body>

</html>
